<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIA Dictation Clean</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }
    h1 { margin: 0 0 8px; text-align: center; }
    .sub { text-align: center; color: #6b7280; margin-bottom: 22px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }
    label.file {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }
    input[type="file"] { display: none; }
    audio { width: 100%; margin-top: 14px; }
    textarea {
      width: 100%;
      min-height: 230px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      line-height: 1.7;
      resize: vertical;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    .primary {
      width: 100%;
      background: #2563eb;
      color: #fff;
      margin-top: 12px;
    }
    .secondary {
      background: #eef2ff;
      color: #1e40af;
      margin-top: 10px;
    }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    .status {
      margin-top: 14px;
      padding: 14px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }
    .ok {
      background: #ecfdf5;
      border-color: #bbf7d0;
      color: #166534;
    }
    .result {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      background: #fff;
      min-height: 120px;
    }
    .small { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>MIA Dictation Clean</h1>
    <p class="sub">Bản tối giản: chọn audio, gõ bài, kiểm tra transcript bằng AI.</p>

    <section class="card">
      <label class="file" for="audioInput">Chọn audio</label>
      <input id="audioInput" type="file" accept="audio/*" />
      <p id="fileName" class="small">Chưa chọn audio</p>
      <audio id="audioPlayer" controls></audio>
      <button class="secondary" onclick="testBackend()">Test backend</button>
    </section>

    <section class="card">
      <h2>Bài gõ của bạn</h2>
      <textarea id="userText" placeholder="Gõ nội dung bạn nghe được ở đây..."></textarea>
      <button id="checkBtn" class="primary" onclick="checkAudio()">Kiểm tra & sửa bài</button>
      <div id="status" class="status">Sẵn sàng. Hãy chọn audio ngắn trước, khoảng 10-20 giây.</div>
    </section>

    <section class="card">
      <h2>Đáp án AI nghe được</h2>
      <div id="transcript" class="result">Chưa có kết quả.</div>
    </section>
  </main>

  <script>
    const audioInput = document.getElementById("audioInput");
    const audioPlayer = document.getElementById("audioPlayer");
    const fileName = document.getElementById("fileName");
    const statusBox = document.getElementById("status");
    const transcriptBox = document.getElementById("transcript");
    const checkBtn = document.getElementById("checkBtn");
    const userText = document.getElementById("userText");

    let selectedAudio = null;

    audioInput.addEventListener("change", () => {
      selectedAudio = audioInput.files[0] || null;
      if (!selectedAudio) return;
      audioPlayer.src = URL.createObjectURL(selectedAudio);
      fileName.textContent = selectedAudio.name + " - " + Math.round(selectedAudio.size / 1024) + " KB";
      setStatus("Đã chọn audio. Bấm Kiểm tra & sửa bài.", "ok");
    });

    function setStatus(message, type) {
      statusBox.className = "status" + (type ? " " + type : "");
      statusBox.textContent = message;
    }

    async function testBackend() {
      setStatus("Đang test backend...", "");
      try {
        const response = await fetch("/api/ping", { method: "GET" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Backend lỗi.");
        setStatus("Backend OK: " + data.message, "ok");
      } catch (error) {
        setStatus("Backend chưa kết nối được. Lỗi: " + error.message, "error");
      }
    }

    async function checkAudio() {
      if (!selectedAudio) {
        setStatus("Bạn chưa chọn audio.", "error");
        return;
      }

      if (!userText.value.trim()) {
        setStatus("Bạn chưa gõ bài dictation.", "error");
        return;
      }

      checkBtn.disabled = true;
      setStatus("Đang gửi audio lên backend và gọi OpenAI...", "");

      try {
        const formData = new FormData();
        formData.append("audio", selectedAudio);
        formData.append("prompt", "Transcribe this dictation audio accurately.");
        formData.append("language", "en");

        const response = await fetch("/api/check", {
          method: "POST",
          body: formData
        });

        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error("Backend trả về không phải JSON: " + raw.slice(0, 300));
        }

        if (!response.ok) {
          throw new Error(data.error || "Backend/OpenAI lỗi.");
        }

        transcriptBox.textContent = data.transcript || "(AI không nghe được nội dung)";
        setStatus("Xong. AI đã trả transcript.", "ok");
      } catch (error) {
        setStatus("Không kiểm tra được. Lỗi thật: " + error.message, "error");
      } finally {
        checkBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
